<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Copy Cat history</title>
  <link rel="stylesheet" href="sidepanel.css">
</head>
<body>
  <header>
    <h3><img class="title-icon" src="32.png" alt="">Copy Cat history</h3>
    <input id="search" type="search" placeholder="Filter…" autocomplete="off">
    <div class="tools">
      <span id="status"></span>
      <button id="clear" title="Remove all unpinned entries">Clear</button>
    </div>
  </header>
  <section id="groups-section" hidden>
    <div class="section-title">Saved groups</div>
    <ul id="groups"></ul>
  </section>
  <section>
    <div class="section-title">History</div>
    <ul id="list"></ul>
    <p id="empty" hidden>Nothing copied yet. Copy something with Ctrl+Shift+click.</p>
  </section>
  <script src="sidepanel.js"></script>
  <script src="sidepanel-groups.js"></script>
</body>
</html>
